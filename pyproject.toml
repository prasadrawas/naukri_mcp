[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naukri-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Naukri.com"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Naukri Agent Team"}
]
keywords = ["mcp", "model-context-protocol", "naukri", "claude", "chatgpt", "job-search"]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "httpx2>=2.16.0"
]

[project.scripts]
naukri-mcp = "naukri_mcp.__main__:main"
